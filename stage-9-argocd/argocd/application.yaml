apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mealie-gitops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/areghan/mealie-kubernetes.git
    targetRevision: main
    path: stage-8-helm/mealie

    helm:
      values: |
        namespace: mealie-gitops

        mealie:
          replicaCount: 2
          ingress:
            enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: mealie-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
