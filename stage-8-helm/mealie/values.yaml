namespace: mealie

mealie:
  replicaCount: 1

  image:
    repository: ghcr.io/mealie-recipes/mealie
    tag: v3.22.0
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9000
    targetPort: 9000

  ingress:
    enabled: true
    className: nginx
    path: /helm-api
    pathType: Prefix

postgres:
  replicaCount: 1

  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent

  service:
    port: 5432
    targetPort: 5432

  persistence:
    enabled: true
    existingClaim: ""
    size: 5Gi
    accessMode: ReadWriteOnce

  database:
    user: mealie
    password: mealie
    name: mealie
